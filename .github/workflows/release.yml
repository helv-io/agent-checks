name: release
on:
  push:
    tags: ["v[0-9]+.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "::error::VERSION says $(cat VERSION) but the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Unit tests
        run: ./tools/test
      - name: Notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME#v}" '$1 == "##" { on = ($2 == v); next } on' CHANGELOG.md > notes.md && test -s notes.md
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
